buildscript {
    rootProject.ext.secureBuildFamilies = [
        'io.netty': '4.1.139.Final',
        'com.google.protobuf': '3.25.9'
    ]
    // Patch every buildscript resolution (including plugin-created classpaths).
    // Constraints below only affect the classpath which declares them.
    rootProject.ext.secureBuildModules = [
        'org.bouncycastle:bcprov-jdk18on': '1.86',
        'org.bouncycastle:bcpkix-jdk18on': '1.86',
        'org.bouncycastle:bcutil-jdk18on': '1.86',
        'org.apache.httpcomponents:httpclient': '4.5.14',
        'org.apache.commons:commons-lang3': '3.21.0',
        'org.apache.commons:commons-compress': '1.28.0',
        'org.jetbrains.kotlin:kotlin-gradle-plugin': '2.4.21'
    ]
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            def module = "${details.requested.group}:${details.requested.name}"
            def patched = rootProject.secureBuildModules[module] ?:
                rootProject.secureBuildFamilies[details.requested.group]
            if (patched != null) {
                details.useVersion(patched)
                details.because('Use patched Gradle build-tool transitives')
            }
        }
    }
    dependencies {
        // These libraries belong to AGP/lint and Gradle plugins, not the installed
        // Android application. Keep transitive build tools on patched versions.
        classpath platform("io.netty:netty-bom:${rootProject.secureBuildFamilies['io.netty']}")
        classpath platform("com.google.protobuf:protobuf-bom:${rootProject.secureBuildFamilies['com.google.protobuf']}")
        constraints {
            classpath('org.bouncycastle:bcprov-jdk18on:1.86')
            classpath('org.bouncycastle:bcpkix-jdk18on:1.86')
            classpath('org.bouncycastle:bcutil-jdk18on:1.86')
            classpath('org.apache.httpcomponents:httpclient:4.5.14')
            classpath('org.apache.commons:commons-lang3:3.21.0')
            classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:2.4.21')
            classpath('org.apache.commons:commons-compress:1.28.0')
            classpath('org.jdom:jdom2:2.0.6.1')
            classpath('org.bitbucket.b_c:jose4j:0.9.7')
        }
    }
}

plugins { id 'com.android.application' version '9.4.1' apply false }

allprojects {
    // Project buildscript classpaths and AGP-managed tool configurations are
    // independent: both need the same security floors.
    buildscript.configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            def module = "${details.requested.group}:${details.requested.name}"
            def patched = rootProject.secureBuildModules[module] ?:
                rootProject.secureBuildFamilies[details.requested.group]
            if (patched != null) {
                details.useVersion(patched)
                details.because('Align plugin classpaths with patched build dependencies')
            }
        }
    }
    configurations.configureEach {
        resolutionStrategy.eachDependency { details ->
            def module = "${details.requested.group}:${details.requested.name}"
            def patched = rootProject.secureBuildModules[module] ?:
                rootProject.secureBuildFamilies[details.requested.group]
            if (patched != null) {
                details.useVersion(patched)
                details.because('Align Android tool configurations with patched build dependencies')
            }
        }
    }
}
