buildscript {
    rootProject.ext.secureBuildFamilies = [
        'io.netty': '4.1.139.Final',
        'com.google.protobuf': '3.25.9'
    ]
    dependencies {
        // These libraries belong to AGP/lint, not the installed app. Align their
        // patched versions without migrating the Android plugin's major API.
        classpath platform("io.netty:netty-bom:${rootProject.secureBuildFamilies['io.netty']}")
        classpath platform("com.google.protobuf:protobuf-bom:${rootProject.secureBuildFamilies['com.google.protobuf']}")
        constraints {
            classpath('org.bouncycastle:bcprov-jdk18on:1.86')
            classpath('org.bouncycastle:bcpkix-jdk18on:1.86')
            classpath('org.bouncycastle:bcutil-jdk18on:1.86')
            classpath('org.apache.commons:commons-compress:1.28.0')
            classpath('org.jdom:jdom2:2.0.6.1')
            classpath('org.bitbucket.b_c:jose4j:0.9.7')
        }
    }
}

plugins { id 'com.android.application' version '9.4.1' apply false }

allprojects {
    configurations.configureEach {
        // AGP also creates separate device-test/tool configurations. They do not
        // inherit the plugin classpath BOMs and must use the same patched family.
        resolutionStrategy.eachDependency { details ->
            def patched = rootProject.secureBuildFamilies[details.requested.group]
            if (patched != null) {
                details.useVersion(patched)
                details.because('Align Android tool configurations with patched build dependencies')
            }
        }
    }
}
