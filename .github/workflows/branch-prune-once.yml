name: One-time branch cleanup
on:
  push:
    branches: [main]
    paths: ['.github/workflows/branch-prune-once.yml']
permissions:
  contents: write
jobs:
  prune:
    if: github.repository == 'niakw/NiakTV'
    runs-on: ubuntu-latest
    steps:
      - name: Remove obsolete refs except main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in fix/build-dependency-security fix/gradle-transitive-dependency-audit dependabot/gradle/org.apache.commons-commons-lang3-3.21.0; do
            if gh api "repos/${GH_REPO}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GH_REPO}/git/refs/heads/${branch}"
              echo "Deleted obsolete branch: ${branch}"
            fi
          done
          echo 'Remaining branches:'
          gh api --paginate "repos/${GH_REPO}/branches?per_page=100" --jq '.[].name'
