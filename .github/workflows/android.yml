name: Android
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: 'false'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Check frontend JavaScript
        run: |
          node --check app/src/main/assets/i18n.js
          node --check app/src/main/assets/ui.js
      - name: Report resolved build and app dependencies
        run: ./gradlew --no-daemon buildEnvironment :app:dependencies --configuration debugRuntimeClasspath > dependency-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: dependency-report
          path: dependency-report.txt
      - uses: actions/upload-artifact@v7
        with:
          name: niaktv-debug
          path: app/build/outputs/apk/debug/app-debug.apk
