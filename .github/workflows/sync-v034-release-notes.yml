name: Apply detailed v0.3.4 release notes
on:
  push:
    paths:
      - '.github/workflows/sync-v034-release-notes.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-existing-release:
    if: github.repository == 'niakw/NiakTV'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update existing release description (no APK changes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/contents/docs/CHANGELOG_v0.3.4.md" --jq '.content' | base64 --decode > /tmp/release-notes.md
          grep -q '0.3.2-dev' /tmp/release-notes.md
          grep -q '0.3.3-dev' /tmp/release-notes.md
          gh release edit v0.3.4 --repo "$GITHUB_REPOSITORY" --notes-file /tmp/release-notes.md
          gh release view v0.3.4 --repo "$GITHUB_REPOSITORY" --json body --jq '.body | contains("0.3.2-dev") and contains("0.3.3-dev")'
