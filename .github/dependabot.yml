version: 2
# Single-branch maintenance: no routine Dependabot version-update pull requests.
# GitHub dependency alerts, scanning and manual security upgrades remain available.
# Security update PRs, if enabled in repository settings, are configured separately.
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
